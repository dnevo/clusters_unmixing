[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clusters_unmixing"
version = "0.2.0"
description = "Lean spectral unmixing experiment framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "pydantic>=2",
  "pyyaml",
  "torch",
]

[project.optional-dependencies]
# CUDA-only, requires a compiler toolchain to build. Kept as an extra (not a
# hard dependency of the package) since only the mamba model needs it - it's
# required to use that model at all, which assumes a GPU runtime.
mamba = ["mamba-ssm"]
# Only needed when ExperimentConfig.use_wandb is enabled.
wandb = ["wandb"]

[tool.setuptools]
package-dir = {"" = "src"}

