experiment_name: cluster_corr_options

cluster_sets:

  - name: 6clusters_thomas
    path: data/6clusters_thomas.csv

  - name: 6clusters_digitized
    path: data/6clusters_digitized.csv

# Metrics implemented in src/clusters_unmixing/core_math.py
metrics:
  - cosine
  - sam

model_evaluation:
  # models registered in models/runner_registry.py
  models:

    - name: sunsal
      params:
        μ: 0.001
        λ_reg: 0.0
        max_iters: 300
        tol: 1.0e-6
        check_every: 10
        verbose: false

    - name: vpgdu
      params:
        initial_estimator_num_samples: 500
        threshold: 1.0e-6
        max_iters: 500
        t: 10
        verbose: false

    - name: small_mlp
      params:
        hidden_dim_1: 64
        hidden_dim_2: 32
        epochs: 400
        batch_size: 128
        learning_rate: 0.001
        weight_decay: 0.00001
        lambda_recon: 0.1
        clip_grad_norm: 1.0
        patience: 20
        verbose: true         # options: true | false

    - name: convnext1d
      params:
        epochs: 400
        batch_size: 32
        learning_rate: 0.001
        weight_decay: 0.0001
        dropout: 0.15
        lambda_recon: 0.1
        clip_grad_norm: 1.0
        pool_bins: 8
        kernel_size: 7
        patience: 20
        verbose: true         # options: true | false

    - name: kan
      params:
        hidden_dim: 32
        grid_size: 5
        spline_order: 3
        epochs: 400
        batch_size: 128
        learning_rate: 0.001
        weight_decay: 0.00001
        lambda_recon: 0.1
        clip_grad_norm: 1.0
        patience: 20
        verbose: true         # options: true | false

    - name: mamba
      params:
        d_model: 32
        d_state: 16
        d_conv: 4
        expand: 2
        depth: 1
        patch_size: 8
        epochs: 400
        batch_size: 128
        learning_rate: 0.001
        weight_decay: 0.00001
        lambda_recon: 0.1
        clip_grad_norm: 1.0
        patience: 20
        verbose: true         # options: true | false
  runs:
    # run 1/2
    - cluster_set: 6clusters_thomas

      bands_ranges:
        # Chosen by an empirical sweep (train small_mlp, compare real
        # abundance_rmse) across band-selection candidates: a narrower
        # cosine-correlation-optimized selection (1.8-2.0um only) actually
        # performed worse (rmse=0.148) than using nearly the full spectrum
        # (rmse=0.079) - noise-averaging from more bands matters more than
        # endmember separability here. Only the near-zero-signal sensor edge
        # (0.35-0.40um) is trimmed.
        - range_µm: [0.4, 2.5]
          reduce: none          # options: none | mean

      normalization: with_quadratic   # options: without | with_quadratic
      transform:
        steps: []   # no transform
      # without any transform:
      # transform:
      #   steps: []
      # first_derivative only:
      # transform:
      #   steps:
      #     - name: first_derivative
      # PCA only:
      # transform:
      #   steps:
      #     - name: pca
      #       params:
      #         n_components: 5
      # first_derivative + PCA:
      # transform:
      #   steps:
      #     - name: first_derivative
      #     - name: pca
      #       params:
      #         n_components: 5

      num_pixels: 10000 # number of synthetic pixels generated

      # signal-to-noise ratio
      snr_db: 20.0 # number (e.g 30.0) or inf (for no noise)

      models:
        - sunsal
        - vpgdu
        - small_mlp
        #- convnext1d
        #- kan
        - mamba

    # run 2/2
    - cluster_set: 6clusters_thomas

      bands_ranges:

        - range_µm: [0.5, 2.5]
          reduce: none          # options: none | mean

      normalization: with_quadratic   # options: without | with_quadratic
      transform:
        steps: []   # no transform

      num_pixels: 10000 # number of synthetic pixels generated

      # signal-to-noise ratio
      snr_db: 20.0 # number (e.g 30.0) or inf (for no noise)

      models:
        - sunsal
        - vpgdu
        - small_mlp
        - kan
        - mamba
