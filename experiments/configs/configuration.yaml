experiment_name: cluster_corr_options

# Ask PyTorch/cuDNN/cuBLAS for bit-exact CUDA determinism, at a performance
# cost (see pipelines/experiment_pipeline.py's _set_global_seeds docstring).
# Automatically skipped for runs that include the mamba model.
extra_reproducibility: false

# Log each model call to Weights & Biases as its own run, plus a summary run
# per batch that uploads the output CSVs as an artifact. Requires the 'wandb'
# extra (pip install -e .[wandb]) and a logged-in wandb account.
use_wandb: false

cluster_sets:

  - name: 6clusters_thomas
    path: data/6clusters_thomas.csv

metrics:
  - cosine
  - sam

models:

  - name: sunsal
    params:
      μ: 0.001
      λ_reg: 0.0
      max_iters: 400
      tol: 1.0e-6
      check_every: 10
      verbose: true

  - name: vpgdu
    params:
      initial_estimator_num_samples: 500
      threshold: 1.0e-6
      max_iters: 500
      t: 10
      verbose: true

  - name: mlm
    params:
      # Multilinear Mixing Model (Heylen & Scheunders, 2016). p_min is
      # negative (not just [0, 1)) because this project's own
      # nonlinearity_gamma/GBM synthetic generator only ever increases
      # reflectance relative to linear mixing, and MLM needs P<0 to fit
      # that direction of deviation (see models/mlm.py docstring).
      p_min: -5.0
      p_max: 0.999
      num_p_candidates: 201
      refine_iters: 3
      sunsal_mu: 0.05
      sunsal_max_iters: 300
      sunsal_tol: 1.0e-6
      verbose: true

  - name: gbm
    params:
      # Generalized Bilinear Model (Halimi et al., 2011): per-pixel projected
      # gradient descent with a golden-section line search, following the
      # authors' companion GDA algorithm (see models/gbm.py). max_iters/tol
      # match the reference MATLAB code's own defaults (Niter=900, |DER|<1e-5),
      # with per-pixel early stopping once a pixel converges. Unlike every
      # other model here, this one still runs up to max_iters gradient steps
      # per pixel (vectorized over pixels, not free) - expect it to be slower
      # than sunsal/vpgdu/mlm at num_pixels: 10000; lower max_iters first if
      # you just want a quick comparison against mlm.
      max_iters: 900
      tol: 1.0e-5
      sunsal_mu: 0.05
      sunsal_max_iters: 300
      sunsal_tol: 1.0e-6
      check_every: 10
      verbose: true

  - name: small_mlp
    params:
      hidden_dim_1: 64
      hidden_dim_2: 32
      epochs: 400
      batch_size: 128
      learning_rate: 0.001
      weight_decay: 0.00001
      lambda_recon: 0.1
      clip_grad_norm: 1.0
      patience: 20
      verbose: true         # options: true | false

  - name: convnext1d
    params:
      epochs: 400
      batch_size: 32
      learning_rate: 0.001
      weight_decay: 0.0001
      dropout: 0.15
      lambda_recon: 0.1
      clip_grad_norm: 1.0
      pool_bins: 8
      kernel_size: 7
      patience: 20
      verbose: true         # options: true | false

  - name: kan
    params:
      hidden_dim: 32
      grid_size: 5
      spline_order: 3
      epochs: 400
      batch_size: 128
      learning_rate: 0.001
      weight_decay: 0.00001
      lambda_recon: 0.1
      clip_grad_norm: 1.0
      patience: 20
      verbose: true         # options: true | false

  - name: mamba
    params:
      d_model: 32
      d_state: 16
      d_conv: 4
      expand: 2
      depth: 1
      patch_size: 8
      epochs: 400
      batch_size: 128
      learning_rate: 0.001
      weight_decay: 0.00001
      lambda_recon: 0.1
      clip_grad_norm: 1.0
      patience: 20
      verbose: true         # options: true | false

runs:
  # run 1/2
  - cluster_set: 6clusters_thomas

    bands_ranges:
      - range_µm: [0.4, 2.5]
        reduce: none          # options: none | mean

    normalization: quadratic   # options: none | quadratic

    num_pixels: 10000 # number of synthetic pixels generated

    # signal-to-noise ratio in dB; higher = less noise. Use .inf for zero noise
    # (noiseless pixels) - infinite SNR is the mathematical way of saying "no noise".
    # NOTE: the leading dot is required - YAML only parses ".inf" as float infinity;
    # bare "inf" is read as the string "inf", which passes validation unnoticed here
    # (sweep_params values aren't type-checked) and only fails deep in core_math.py's
    # np.isinf() with a confusing TypeError.
    snr_db: 30.0

    # Generalized Bilinear Model nonlinearity strength in [0, 1] applied when
    # synthesizing pixels: 0.0 = standard linear mixing, 1.0 = Fan model
    # (full pairwise multiple-scattering interaction between endmembers).
    # For 6clusters_thomas (chemically graded soil, not distinct materials), treat
    # this as a numerical robustness knob rather than a physical simulation.
    nonlinearity_gamma: 0.25

    models:
      - sunsal
      - vpgdu
      - mlm
      - gbm
      - small_mlp
      - kan
      - mamba

    sweep_params:
      snr_db: [30.0, .inf]   # must be ".inf", not "inf" - see note above
      normalization: [none, quadratic]
      nonlinearity_gamma: [0.0, 0.25]
